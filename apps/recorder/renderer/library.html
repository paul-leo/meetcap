<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Recordings</title>
  <style>
    :root { color-scheme: dark; --bg: #0f1115; --card: #171a20; --card-2: #1d2129; --border: #262b34;
      --text: #eceef1; --muted: #8b93a1; }
    * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
    body { font: 13px/1.45 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 14px; }
    .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .head h3 { margin: 0; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
    .ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 9px; padding: 5px 10px; font-size: 11.5px; cursor: pointer; font-family: inherit; }
    .ghost:hover { color: var(--text); border-color: #333a46; }
    #library .empty { color: var(--muted); font-size: 12px; padding: 24px 2px; text-align: center; }
    #library .item { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-top: 1px solid var(--border); }
    #library .item:first-child { border-top: 0; }
    #library .thumb { width: 30px; height: 30px; border-radius: 8px; background: var(--card-2); display: grid; place-items: center; color: var(--muted); flex: none; }
    #library .thumb svg { width: 14px; height: 14px; }
    #library .meta { flex: 1; min-width: 0; }
    #library .meta .t { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #library .meta .s { color: var(--muted); font-size: 11px; }
    #library .actions { display: flex; gap: 6px; opacity: 0; transition: opacity .12s; }
    #library .item:hover .actions { opacity: 1; }
    .icon-btn { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
    .icon-btn svg { width: 13px; height: 13px; }
    .icon-btn:hover { color: var(--text); border-color: #3a4250; }
    .icon-btn.danger:hover { color: #ff8f88; border-color: #4a2320; }
    video { width: 100%; max-height: 220px; margin-top: 10px; border-radius: 10px; outline: none; background: #000; }
  </style>
</head>
<body>
  <div class="head">
    <h3>Recordings <span id="lib-count"></span></h3>
    <button class="ghost" id="btn-open-folder">Show in Finder</button>
  </div>
  <div id="library"></div>
  <div id="player"></div>
  <script src="library.js"></script>
</body>
</html>
