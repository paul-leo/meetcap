<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>meetcap Recorder</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body { font: 12.5px/1 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: #e9ebee;
           display: flex; flex-direction: column; justify-content: flex-end; }

    .bar {
      flex: none; height: 48px; margin: 3px; border-radius: 999px;
      background: rgba(28, 30, 36, .96); border: 1px solid rgba(255,255,255,.09);
      box-shadow: 0 8px 28px rgba(0,0,0,.5);
      display: flex; align-items: center; gap: 4px; padding: 0 10px 0 6px;
    }
    .drag { -webkit-app-region: drag; color: #5b626e; padding: 0 4px; cursor: grab; display: grid; place-items: center; }
    .drag svg { width: 13px; height: 13px; }

    .btn {
      -webkit-app-region: no-drag; border: 0; background: transparent; color: #aeb5c0;
      height: 34px; border-radius: 999px; cursor: pointer; display: flex; align-items: center;
      gap: 6px; padding: 0 10px; font: inherit; transition: background .12s, color .12s;
    }
    .btn:hover { background: rgba(255,255,255,.08); color: #fff; }
    .btn svg { width: 15px; height: 15px; flex: none; }
    .btn.icon { padding: 0; width: 34px; justify-content: center; }

    /* ── independent input selectors: [toggle][chooser] pills ──────────────── */
    .seg {
      -webkit-app-region: no-drag; display: flex; align-items: stretch;
      background: rgba(255,255,255,.07); border-radius: 999px; height: 34px; overflow: hidden;
    }
    .seg > button, .tgl.solo {
      -webkit-app-region: no-drag; border: 0; background: transparent; color: #7b828d;
      cursor: pointer; display: flex; align-items: center; font: inherit;
      transition: background .12s, color .12s;
    }
    .seg > button:hover { background: rgba(255,255,255,.09); }
    .tgl { padding: 0 8px 0 10px; }
    .tgl svg { width: 15px; height: 15px; }
    .tgl.on { color: #32d74b; }
    .tgl.solo { height: 34px; border-radius: 999px; background: rgba(255,255,255,.07); padding: 0 10px; }
    .tgl.solo:hover { background: rgba(255,255,255,.12); }
    .pick { padding: 0 9px 0 2px; gap: 5px; color: #aeb5c0; }
    .pick:hover { color: #fff; }
    .pick .lbl { max-width: 108px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; font-weight: 500; }
    .pick svg.chev { width: 10px; height: 10px; opacity: .6; flex: none; }

    /* ── device popover (opens upward; the window grows to fit it) ─────────── */
    .pop {
      position: fixed; bottom: 60px; width: 260px;
      background: rgba(28, 30, 36, .97); border: 1px solid rgba(255,255,255,.1);
      border-radius: 14px; box-shadow: 0 10px 34px rgba(0,0,0,.55);
      padding: 8px; z-index: 10;
    }
    .pop .meter { height: 26px; display: flex; align-items: center; gap: 8px; padding: 0 8px 6px; }
    .pop .meter svg { width: 13px; height: 13px; color: #32d74b; flex: none; }
    .pop .meter .track { flex: 1; height: 5px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
    .pop .meter .fill { height: 100%; width: 0; border-radius: 3px; background: #32d74b; transition: width .06s linear; }
    .pop .row {
      display: flex; align-items: center; gap: 8px; width: 100%;
      border: 0; background: transparent; color: #d6dae0; font: inherit; font-size: 12.5px;
      height: 30px; padding: 0 8px; border-radius: 8px; cursor: pointer; text-align: left;
    }
    .pop .row:hover { background: rgba(255,255,255,.08); color: #fff; }
    .pop .row .check { width: 14px; flex: none; color: #32d74b; }
    .pop .row span.name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pop .none { color: #7b828d; font-size: 12px; padding: 8px; }

    .rec {
      -webkit-app-region: no-drag; width: 28px; height: 28px; border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,.35); background: transparent;
      cursor: pointer; display: grid; place-items: center; margin: 0 4px; padding: 0;
      transition: border-color .12s;
    }
    .rec:hover { border-color: rgba(255,255,255,.6); }
    .rec .core { width: 16px; height: 16px; border-radius: 50%; background: #ff453a; transition: all .15s; }
    .rec:hover .core { background: #ff5c52; }
    body.recording .rec .core { border-radius: 3.5px; width: 11px; height: 11px; } /* ● → ■ */

    .timer { font: 600 13px/1 "SF Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; color: #ff9f98; min-width: 42px; text-align: center; display: none; }
    body.recording .timer { display: block; }
    body:not(.recording) .idle-only { display: flex; }
    body.recording .idle-only { display: none; }
    body:not(.recording) .rec-only { display: none; }
    body.recording .rec-only { display: flex; }

    .meet-chip {
      -webkit-app-region: no-drag; display: none; align-items: center; gap: 5px;
      background: rgba(50,215,75,.14); border: 1px solid rgba(50,215,75,.35); color: #7ce49a;
      border-radius: 999px; padding: 0 10px; height: 30px; font-size: 11.5px; font-weight: 500; cursor: pointer;
    }
    .meet-chip.show { display: flex; }
    .meet-chip .g-dot { width: 6px; height: 6px; border-radius: 50%; background: #32d74b; }

    .sep { width: 1px; height: 18px; background: rgba(255,255,255,.1); margin: 0 2px; }
  </style>
</head>
<body>
  <div class="pop" id="pop" hidden></div>

  <div class="bar">
    <div class="drag" title="Drag to move">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>
    </div>

    <!-- screen: toggle + visual picker -->
    <div class="seg idle-only">
      <button class="tgl" id="tgl-screen" title="Screen capture on/off">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M9 21h6M12 17v4"/></svg>
      </button>
      <button class="pick" id="pick-screen" title="Choose screen or window">
        <span class="lbl" id="screen-label">Screen 1</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>

    <!-- camera: toggle + device popover -->
    <div class="seg idle-only">
      <button class="tgl" id="tgl-camera" title="Camera on/off">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 10l4.5-2.5v9L15 14"/><rect x="2.5" y="6" width="12.5" height="12" rx="2"/></svg>
      </button>
      <button class="pick" id="pick-camera" title="Choose camera">
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>

    <!-- mic: toggle + device popover (with live level) -->
    <div class="seg idle-only">
      <button class="tgl" id="tgl-mic" title="Microphone on/off">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg>
      </button>
      <button class="pick" id="pick-mic" title="Choose microphone">
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>

    <!-- system audio: plain toggle -->
    <button class="tgl solo idle-only" id="tgl-sys" title="System audio on/off">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10v4h4l5 4V6l-5 4H4z"/><path d="M16.5 9a4 4 0 0 1 0 6"/></svg>
    </button>

    <span class="meet-chip" id="meet-chip" title="Record this meeting"><span class="g-dot"></span><span id="meet-app">Zoom</span></span>

    <div style="flex:1"></div>

    <span class="timer" id="timer">00:00</span>
    <button class="btn icon rec-only" id="btn-pause" title="Pause">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="5" width="3.2" height="14" rx="1"/><rect x="13.8" y="5" width="3.2" height="14" rx="1"/></svg>
    </button>
    <button class="btn icon rec-only" id="btn-resume" title="Resume" style="display:none">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>
    </button>

    <button class="rec" id="btn-rec" title="Start / stop (⌘⇧R)"><span class="core"></span></button>

    <div class="sep idle-only"></div>
    <button class="btn icon idle-only" id="btn-library" title="Recordings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    </button>
    <button class="btn icon idle-only" id="btn-hide" title="Hide (⌘⇧M to bring back)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <script src="bar.js"></script>
</body>
</html>
