<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Choose what to share</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body { font: 13px/1.35 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: #e9ebee; }

    .modal {
      height: calc(100% - 8px); margin: 4px; border-radius: 18px;
      background: rgba(30, 32, 38, .97); border: 1px solid rgba(255,255,255,.1);
      box-shadow: 0 18px 60px rgba(0,0,0,.55);
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* segmented Screens | Windows tabs */
    .tabs {
      -webkit-app-region: drag;
      display: flex; gap: 8px; padding: 16px 20px 4px;
    }
    .tab {
      -webkit-app-region: no-drag; flex: 1; border: 0; cursor: pointer;
      height: 38px; border-radius: 999px; font: inherit; font-size: 13.5px; font-weight: 500;
      background: rgba(255,255,255,.05); color: #9aa1ac;
      transition: background .12s, color .12s;
    }
    .tab:hover { background: rgba(255,255,255,.1); color: #d6dae0; }
    .tab.active { background: rgba(255,255,255,.16); color: #fff; }

    .grid-wrap { flex: 1; overflow-y: auto; padding: 14px 20px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .grid.screens { grid-template-columns: repeat(2, 1fr); }

    .card {
      border: 0; padding: 8px; margin: 0; font: inherit; color: inherit; text-align: left;
      background: rgba(255,255,255,.04); border-radius: 12px; cursor: pointer;
      outline: 2px solid transparent; outline-offset: -2px;
      transition: background .12s, outline-color .12s;
    }
    .card:hover { background: rgba(255,255,255,.09); }
    .card.selected { background: rgba(75,141,255,.14); outline-color: #4b8dff; }
    .thumb {
      aspect-ratio: 16 / 10; border-radius: 8px; background: #101116;
      display: grid; place-items: center; overflow: hidden;
    }
    .thumb img { max-width: 100%; max-height: 100%; }
    .thumb .empty { color: #5b626e; font-size: 11.5px; }
    .label { display: flex; align-items: center; gap: 6px; padding: 8px 4px 2px; }
    .label img { width: 15px; height: 15px; flex: none; }
    .label span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; color: #d6dae0; }
    .card.selected .label span { color: #fff; }

    .none { color: #7b828d; padding: 32px 0; text-align: center; }

    .footer { display: flex; justify-content: center; gap: 12px; padding: 12px 20px 18px; }
    .btn {
      border: 0; cursor: pointer; font: inherit; font-size: 13.5px; font-weight: 500;
      height: 38px; padding: 0 26px; border-radius: 999px;
      transition: background .12s, color .12s, opacity .12s;
    }
    .btn.cancel { background: rgba(255,255,255,.08); color: #d6dae0; }
    .btn.cancel:hover { background: rgba(255,255,255,.14); color: #fff; }
    .btn.share { background: #4b8dff; color: #fff; }
    .btn.share:hover { background: #6aa1ff; }
    .btn.share:disabled { background: rgba(255,255,255,.08); color: #6b7280; cursor: default; }
  </style>
</head>
<body>
  <div class="modal">
    <div class="tabs">
      <button class="tab active" id="tab-screen">Screens</button>
      <button class="tab" id="tab-window">Windows</button>
    </div>
    <div class="grid-wrap"><div class="grid" id="grid"></div></div>
    <div class="footer">
      <button class="btn cancel" id="btn-cancel">Cancel</button>
      <button class="btn share" id="btn-share" disabled>Share</button>
    </div>
  </div>
  <script src="picker.js"></script>
</body>
</html>
