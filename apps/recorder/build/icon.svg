<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- meetcap Recorder — app icon.
       Open ring = "C" for capture · red dot = record.
       Light, crisp strokes on a clean dark plate. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#272b34"/>
      <stop offset="1" stop-color="#171a20"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9cfd8"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.38" cy="0.32" r="1">
      <stop offset="0" stop-color="#ff6f63"/>
      <stop offset="0.6" stop-color="#ff4b40"/>
      <stop offset="1" stop-color="#e03d33"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- squircle plate -->
  <rect x="96" y="96" width="832" height="832" rx="188" fill="url(#bg)" filter="url(#soft)"/>
  <rect x="98" y="98" width="828" height="828" rx="186" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="4"/>

  <!-- capture ring: open "C", rounded caps, gap at top-right -->
  <g transform="rotate(13 512 512)">
    <circle cx="512" cy="512" r="270" fill="none" stroke="url(#ring)"
            stroke-width="54" stroke-linecap="round"
            stroke-dasharray="1357 340" stroke-dashoffset="0"/>
  </g>

  <!-- record dot -->
  <circle cx="512" cy="512" r="96" fill="url(#dot)"/>
  <ellipse cx="484" cy="478" rx="40" ry="27" fill="#ffffff" opacity="0.25" transform="rotate(-24 484 478)"/>
</svg>
